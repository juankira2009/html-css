<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox centralizado</title>
    <style>

        body{
            background-color: #7d53ff;
            display: flex;
            justify-content: center;
            align-content: center;

        }


        main{
            background-color: #242834;
            height: 95vh;
            width: 90vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }


        section{
            background-color: #b6ff00;
            height: 400px;
            width: 400px;
            color: #242834;
            text-align: center;
        }







    </style>
</head>
<body>
    <main>
        <section>
                <h1>texto para teste</h1>
    </section>
</main>
</body>
</html>
