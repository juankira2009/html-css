<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>

        div#container{

            background-color: violet;
            height: 100px;
            display: flex;
            flex-flow: column wrap-reverse;




        }


        div#item{
            border: 1px solid black;
            background-color: slategray;
            flex: auto;
            text-align: center;
            height: 40px;
            
            
        }





    </style>
</head>
<body>
    <div id="container">
        <div id="item"><p>Exemplo de bloco A</p></div>
        <div id="item"><p>Exemplo de bloco B</p></div>
        <div id="item"><p>Exemplo de bloco C</p></div>
        <div id="item"><p>Exemplo de bloco D</p></div>
        <div id="item"><p>Exemplo de bloco E</p></div>
        <div id="item"><p>Exemplo de bloco F</p></div>
        <div id="item"><p>Exemplo de bloco G</p></div>
        <div id="item"><p>Exemplo de bloco H</p></div>
    </div>
</body>
</html>
