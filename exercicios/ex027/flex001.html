<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>

        div#container{

            background-color: violet;
            display: flex;
            height: 100px;




        }


        div#item{
            border: 1px solid black;
            background-color: slateblue;
            flex: auto;
            text-align: center;
            height: 50px;
            margin-top: 20px;
        }





    </style>
</head>
<body>
    <div id="container">
        <div id="item"><p>A</p></div>
        <div id="item"><p>B</p></div>
        <div id="item"><p>C</p></div>
        <div id="item"><p>D</p></div>
        <div id="item"><p>E</p></div>
        <div id="item"><p>F</p></div>
        <div id="item"><p>G</p></div>
        <div id="item"><p>H</p></div>
    </div>
</body>
</html>
