<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>

        div#container{

            background-color: violet;
            display: flex;
            flex-flow: row wrap;
            align-content: space-around ;
            height: 400px;
            




        }


        div#item{
            border: 1px solid black;
            background-color: slateblue;
            text-align: center;
            padding: 40px;
            
        }





    </style>
</head>
<body>
    <div id="container">
        <div id="item">A</div>
        <div id="item">B</div>
        <div id="item">C</div>
        <div id="item">D</div>
        <div id="item">E</div>
        <div id="item">F</div>
        <div id="item">G</div>
        <div id="item">H</div>
        <div id="item">I</div>
        <div id="item">J</div>
        <div id="item">K</div>
        <div id="item">L</div>
        <div id="item">M</div>
        <div id="item">N</div>
        
    </div>
</body>
</html>
