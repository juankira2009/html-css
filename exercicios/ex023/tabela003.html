<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body{
           font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            text-align: center;
        }


        table{
            border-collapse: collapse;
            width: 300px;
            margin:auto
        }
        td{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            
        }



    </style>
</head>
<body>
    <h1>mesclagem de tabelas</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>
         <tr>
            <td rowspan="2">D</td>
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>
         <tr>
            
            <td>H</td>
            
        </tr>
         <tr>
            
            <td>K</td>
            <td colspan="2">L</td>
        </tr>




    </table>
    
</body>
</html>
