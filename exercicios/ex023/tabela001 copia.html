<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            text-align: center;
        }

        td{
            border: 2px solid black;
            text-align: center;
            
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            margin: auto;
        }
        
        .numero{
            text-align: right;
        }
        



    </style>
</head>
<body>
    <h1>minha primeira tabela</h1>

        <!--
                        hierarquia de tabelas (simples)
                    table= tabela
                    table row= linha de tabela
                    table header= cabeçalho
                    table data= dados da tabela 
        -->

    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td>D2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="numero">B3</td>
            <td>C3</td>
            <td>D3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
            <td class="numero">D4</td>
        </tr>
        

    </table>
</body>
</html>
