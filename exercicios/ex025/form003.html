<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de fórmulario</title>
</head>
<body>
    <h1>teste de fórmulario</h1>
    <form action="cadastro.php" method="get">

        <p>
            <label for="inome">nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="nome completo">

        <p>
                <label for="imedia">média:</label>
                <input type="number" name="media" id="imedia" required min="o" max="10" value="5" step="0.1">
        </p>

        <p>
            <label for="imes">período letivo:</label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="idata">dia da prova:</label>
            <input type="date" name="data" id="idata">
        </p>
        <p>
            <label for="ihora">horário da prova</label>
            <input type="time" name="hora" id="ihora">


        </p>
        </p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        <p>

    </form>
</body>
</html>
