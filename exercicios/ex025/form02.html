<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fórmulario</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h1>teste de fórmulario</h1>
    <form action="cadastro.php" method="post">

        <p>
            usuário:
            <label for="iusu"></label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" placeholder="nome de usuário">

        </p>
        <p>
            senha:
            <label for="isenha"></label>
            <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" placeholder="mínimo 8 letras">

        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
