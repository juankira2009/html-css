<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de fórmulario</title>
</head>
<body>
    <h1>teste de fórmulario</h1>
<fieldset>
        <legend style="font-weight: bolder;">fórmulario de email</legend>

        <form action="cadastro.php" method="get" autocomplete="on">
        
    <p>
        <label for="inome">Nome:</label>
        <input type="text" name="Nome" id="inome" required maxlength="30" placeholder="nome completo" aut>
    </p>
        
        
    <p>
        <label for="imail">email:</label>
        <input type="email" name="mail" id="imail" required   minlength="10" maxlength="25" autocomplete="email" placeholder="email válido">
    </p>
        
        
    <p>
        <label for="itel">Telefone:</label>
        <input type="tel" name="tel" id="itel" required placeholder="(xx) xxxx-xxxx" pattern="^[0-9]{2}+[0-9]{4}+[-][0-9]{4}$" autocomplete="tel">
    </p>
        
        <!--estudar mais sobre regex-->

    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>
    </form>
</fieldset>
</body>
</html>
