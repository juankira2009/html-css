<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de fórmulario</title>
</head>
<body>
    <h1>testes de fórmulario</h1>

<form action="cadastro.php" method="post">

    <p>
        <label for="iest">Estado em que habito:</label>
        <select name="Est" id="iest">
            <optgroup label="sudeste">
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RS">Rio Grande do Sul</option>
            </optgroup>
            <optgroup label="norte">
                <option value="AM">Amazonas</option>
                <option value="PA">Pará</option>
                <option value="RR">Roraima</option>
                <option value="MP">Amapá</option>
            </optgroup>
         </select>
    </p>
    <p>

        <label for="iprof">profissão:</label>
        <input type="text" name="prof" id="iprof" list="ilist">
        <datalist id="ilist">
                <option value="Garoto de programa"></option>
                <option value="TI"></option>
                <option value="pedreiro"></option>
                <option value="cozinheiro"></option>
                <option value="policial"></option>
                <option value="desenvolverdor"></option>
                <option value="minerador de bitcoin"></option>
                <option value="eletricista"></option>
        </datalist>


        <p>
            <textarea name="texto" id="itexto" cols="30" rows="10"></textarea>
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
</form>

</body>
</html>
