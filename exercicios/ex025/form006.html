<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de fórmulario</title>
</head>
<body>
    <h1>teste de fórmulario</h1>
    <form action="" method="get">

            <p>
                <label for="icor">Cor:</label>
                <input type="color" name="cor" id="icor" value="#9515bb">
            </p>

            <p>
                <label for="inivel">Nível:</label>
                <input type="range" name="nivel" id="inivel" min="0" max="50" value="15">
                
            </p>

            <p>
                <label for="ifoto">adicione uma foto de perfil</label>
                <input type="file" name="foto" id="ifoto">
                
            </p>

            <p>
                <input type="submit" value="enviar">
                <input type="reset" value="limpar">
            </p>



    </form>
</body>
</html>
