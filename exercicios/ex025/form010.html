<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de fórmulario</title>
</head>
<body>
    <h1>teste de fórmulario</h1>
    <form action="cadastro.php" method="post">
    
    
    <p>

        <label for="iano">em que ano cê nasceu:</label>
        <input type="number" name="ano" id="iano" min="1900" max="2026" 
        oninput="calcIdade()">
    </p>

    <p>
        <label for="idade">sua idade é:</label>
        <output id="idade">0</output>
    </p>
    
    
    
    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>
    </form>
    
    <script>
        function calcIdade() {

            let atual = new Date().getFullYear()
            idade.innerHTML = Number(atual) - Number(iano.value)
        }
</script>
</body>
</html>
