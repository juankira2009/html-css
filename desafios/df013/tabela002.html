<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>segunda tabela do desafio 13</title>

    <style>
            body {
                font-family: Arial, sans-serif;
            }

            table{
                border-collapse: collapse;
                width: 400px;
                margin: auto;
                margin-top: 17.6em;

            }

            th, td {
                border: 1.7px solid #000000;
                padding: 20px;
                text-align: center;}
    </style>

</head>
<body>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
            
         </tr>
          <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
         </tr>

          <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
         </tr>

          <tr>
           
            <td>J</td>
            <td>L</td>
            <td>M</td>
           
         </tr>

          
            <td colspan="4">N</td>
            
         </tr>
        
    </table>
</body>
</html>
