<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio do astronauta</title>
    <style>
        body{
            background-color: #000;
            background-image: url('espaco.jpg');
            background-size: 100% 100%;           
            height: 98vh;
            background-repeat: no-repeat; 
            position: relative;  
        }

        body > div{
            position: absolute;
            background-image: url('astronauta.png');
            background-repeat: no-repeat;
            width: 100vh;
            height: 100vh;
            background-size: 300px 300px;
            background-position: center center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
           }

           div > p{
            color: #ffffff79;
            font-size: 0.9em;
            text-align: center;
            margin-top: 450px;
            font-weight: bold;
           } 

    </style>
</head>
<body>
    <div><p>se leu seu cu é meu </p></div>
</body>
</html>
